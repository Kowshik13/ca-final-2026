<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CA Final Progress Tracker 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0e0e0f;
  --bg2: #151517;
  --bg3: #1c1c1f;
  --text: #e8e6e1;
  --text2: #9e9b94;
  --accent: #c8b97a;
  --green: #6aaa72;
  --red: #c96a5a;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Outfit', sans-serif;
  min-height: 100vh;
  padding: 20px;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
}

header {
  text-align: center;
  margin-bottom: 40px;
}

h1 {
  font-size: 2.5rem;
  margin-bottom: 10px;
  background: linear-gradient(135deg, var(--accent), #8fb88a);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.stats-bar {
  display: flex;
  gap: 20px;
  justify-content: center;
  margin-bottom: 30px;
  flex-wrap: wrap;
}

.stat {
  background: var(--bg2);
  padding: 15px 25px;
  border-radius: 8px;
  text-align: center;
  min-width: 150px;
}

.stat-value {
  font-size: 2rem;
  font-weight: 700;
  color: var(--accent);
}

.stat-label {
  color: var(--text2);
  font-size: 0.9rem;
  margin-top: 5px;
}

.subjects-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
  gap: 25px;
  margin-top: 40px;
}

.subject-card {
  background: var(--bg2);
  border: 1px solid rgba(200, 185, 122, 0.2);
  border-radius: 12px;
  padding: 20px;
}

.subject-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 15px;
}

.subject-title {
  font-size: 1.3rem;
  font-weight: 600;
  color: var(--accent);
}

.subject-progress {
  color: var(--text2);
  font-size: 0.9rem;
}

.progress-bar {
  background: var(--bg3);
  height: 8px;
  border-radius: 4px;
  overflow: hidden;
  margin-bottom: 15px;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), #8fb88a);
  transition: width 0.3s ease;
}

.chapters-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-height: 400px;
  overflow-y: auto;
}

.chapter-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px;
  background: var(--bg3);
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.2s ease;
  border: 1px solid transparent;
}

.chapter-item:hover {
  background: rgba(200, 185, 122, 0.1);
  border-color: var(--accent);
}

.chapter-item.completed {
  opacity: 0.6;
}

.chapter-item.completed .chapter-name {
  text-decoration: line-through;
  color: var(--green);
}

.chapter-checkbox {
  width: 20px;
  height: 20px;
  border: 2px solid var(--accent);
  border-radius: 4px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.chapter-item.completed .chapter-checkbox {
  background: var(--green);
  border-color: var(--green);
}

.chapter-checkbox::after {
  content: '';
  width: 4px;
  height: 8px;
  border: solid white;
  border-width: 0 2px 2px 0;
  transform: rotate(45deg);
  opacity: 0;
}

.chapter-item.completed .chapter-checkbox::after {
  opacity: 1;
}

.chapter-name {
  font-size: 0.9rem;
  flex: 1;
  color: var(--text);
}

.chapter-points {
  color: var(--accent);
  font-size: 0.8rem;
  font-weight: 600;
  min-width: 30px;
}

.btn {
  padding: 12px 24px;
  background: var(--accent);
  color: var(--bg);
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-weight: 600;
  font-size: 0.95rem;
  transition: all 0.2s ease;
}

.btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(200, 185, 122, 0.3);
}

.sync-status {
  position: fixed;
  bottom: 20px;
  right: 20px;
  padding: 12px 16px;
  background: var(--bg2);
  border-radius: 6px;
  font-size: 0.85rem;
  color: var(--text2);
  border: 1px solid rgba(200, 185, 122, 0.2);
}

.sync-status.synced {
  color: var(--green);
  border-color: var(--green);
}

.sync-status.syncing {
  color: var(--accent);
  border-color: var(--accent);
}

@media (max-width: 768px) {
  .subjects-grid {
    grid-template-columns: 1fr;
  }
  
  h1 {
    font-size: 1.8rem;
  }
  
  .stats-bar {
    flex-direction: column;
    align-items: stretch;
  }
}

.confetti {
  position: fixed;
  width: 10px;
  height: 10px;
  pointer-events: none;
  animation: confetti-fall 3s ease-out forwards;
}

@keyframes confetti-fall {
  to {
    transform: translateY(100vh) rotateZ(360deg);
    opacity: 0;
  }
}

.reward-notification {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: var(--bg2);
  padding: 30px;
  border-radius: 12px;
  text-align: center;
  z-index: 2000;
  border: 2px solid var(--accent);
  animation: reward-pop 0.5s ease-out;
}

@keyframes reward-pop {
  0% {
    transform: translate(-50%, -50%) scale(0.5);
    opacity: 0;
  }
  100% {
    transform: translate(-50%, -50%) scale(1);
    opacity: 1;
  }
}

.reward-notification h3 {
  color: var(--accent);
  margin-bottom: 10px;
}

.reward-notification p {
  color: var(--text2);
}
</style>
</head>
<body>

  <div class="stats-bar">

    </div>

    </div>

    </div>

</div>

<div class="sync-status" id="syncStatus">●</div>

<script>
// ====== CONFIG ======

const DEFAULT_SUPABASE_URL = 'https://qcgggntrhtfkjglxnbgi.supabase.co';
const DEFAULT_SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFjZ2dnbnRyaHRma2pnbHhuYmdpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU0OTM3NTgsImV4cCI6MjA5MTA2OTc1OH0.3ovqqIAGDpg-tHig-kddy5fa0PIgtLttkfhBqI7prAk';

    'Related Services',
    'Review of Financial Information',
    'Prospective Financial Information and Other Assurance Services',
    'Digital Auditing & Assurance',
    'Group Audits',
    'Special Features of Audit of Banks & Non-Banking Financial Companies',
    'Overview of Audit of Public Sector Undertakings',
    'Internal Audit',
    'Due Diligence, Investigation & Forensic Accounting',
    'Sustainable Development Goals (SDG) & Environment, Social and Governance (ESG) Assurance',
    'Professional Ethics & Liabilities of Auditors'
  ]
};

const TOTAL_CHAPTERS = Object.values(CHAPTERS).reduce((sum, arr) => sum + arr.length, 0);
const POINTS_PER_CHAPTER = 10;

// ====== STATE ======
let userId = localStorage.getItem('userId') || DEFAULT_USER_ID;
let supabaseUrl = localStorage.getItem('supabaseUrl') || DEFAULT_SUPABASE_URL;
let supabaseKey = localStorage.getItem('supabaseKey') || DEFAULT_SUPABASE_KEY;
let supabaseReady = false;
let localProgress = {};

function getSupabaseHeaders(includeJson = false, includeUpsert = false) {
  const headers = {
    'apikey': supabaseKey,
    'Authorization': `Bearer ${supabaseKey}`
  };
  if (includeJson) headers['Content-Type'] = 'application/json';
  if (includeUpsert) headers['Prefer'] = 'resolution=merge-duplicates,return=minimal';
  return headers;
}

// ====== SUPABASE INIT ======
async function initSupabase() {
  if (!supabaseUrl || !supabaseKey) return;
  
  try {
    // Test connection
    const res = await fetch(`${supabaseUrl}/rest/v1/progress?select=count()`, {
      headers: getSupabaseHeaders()
    });
    supabaseReady = res.ok;
    updateSyncStatus();
    
    if (supabaseReady) {
      loadProgressFromSupabase();
      subscribeToChanges();
    }
  } catch (e) {
    console.warn('Supabase offline, using local cache');
    updateSyncStatus();
  }
}

async function loadProgressFromSupabase() {
  try {
    const res = await fetch(
      `${supabaseUrl}/rest/v1/progress?select=subject,chapter_name,completed&user_id=eq.${encodeURIComponent(userId)}`,
      { headers: getSupabaseHeaders() }
    );
    if (!res.ok) return;
    const data = await res.json();
    
    data.forEach(row => {
      const key = `${row.subject}|${row.chapter_name}`;
      localProgress[key] = row.completed;
    });
    
    renderUI();
  } catch (e) {
    console.error('Failed to load progress:', e);
  }
}

function subscribeToChanges() {
  // Polling fallback for real-time (Supabase requires setup for WebSocket)
  setInterval(loadProgressFromSupabase, 3000);
}

// ====== UI RENDERING ======
function renderUI() {
  const grid = document.getElementById('subjectsGrid');
  grid.innerHTML = '';
  
  Object.entries(CHAPTERS).forEach(([subject, chapters]) => {
    const completed = chapters.filter(ch => {
      const key = `${subject}|${ch}`;
      return localProgress[key];
    }).length;
    
    const card = document.createElement('div');
    card.className = 'subject-card';
    
    const progressPercent = Math.round((completed / chapters.length) * 100);
    
    card.innerHTML = `
      <div class="subject-header">
        <div class="subject-title">${subject}</div>
        <div class="subject-progress">${completed}/${chapters.length}</div>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" style="width: ${progressPercent}%"></div>
      </div>
      <div class="chapters-list">
        ${chapters.map(ch => {
          const key = `${subject}|${ch}`;
          const isCompleted = localProgress[key];
          return `
            <div class="chapter-item ${isCompleted ? 'completed' : ''}" onclick="toggleChapter('${subject}', '${ch.replace(/'/g, "\\'")}')">
              <div class="chapter-checkbox"></div>
              <div class="chapter-name">${ch}</div>
              <div class="chapter-points">+${POINTS_PER_CHAPTER}</div>
            </div>
          `;
        }).join('')}
      </div>
    `;
    
    grid.appendChild(card);
  });
  
  updateStats();
}

function updateStats() {
  const completed = Object.values(localProgress).filter(Boolean).length;
  const totalPoints = completed * POINTS_PER_CHAPTER;
  const completionPercent = Math.round((completed / TOTAL_CHAPTERS) * 100);
  
  document.getElementById('totalPoints').textContent = totalPoints;
  document.getElementById('chaptersCompleted').textContent = completed;
  document.getElementById('completionPercent').textContent = completionPercent + '%';
  document.getElementById('streak').textContent = calculateStreak();
}

function calculateStreak() {
  const lastStudy = localStorage.getItem('lastStudyDate');
  const today = new Date().toDateString();
  
  if (lastStudy === today) {
    return parseInt(localStorage.getItem('streak') || 1);
  }
  return 0;
}

// ====== CHAPTER TOGGLE ======
async function toggleChapter(subject, chapter) {
  const key = `${subject}|${chapter}`;
  const wasCompleted = localProgress[key];
  const newState = !wasCompleted;
  
  localProgress[key] = newState;
  
  // Update local cache
  localStorage.setItem('progress', JSON.stringify(localProgress));
  
  // Update streak
  const today = new Date().toDateString();
  const lastStudy = localStorage.getItem('lastStudyDate');
  if (lastStudy !== today) {
    const currentStreak = parseInt(localStorage.getItem('streak') || 0) + 1;
    localStorage.setItem('streak', currentStreak);
    localStorage.setItem('lastStudyDate', today);
  }
  
  // Show reward notification if completing chapter
  if (newState && !wasCompleted) {
    showReward(chapter);
  }
  
  renderUI();
  
  // Sync to Supabase
  if (supabaseReady) {
    updateSupabase(subject, chapter, newState);
  }
}

async function updateSupabase(subject, chapter, completed) {
  updateSyncStatus(true);
  
  try {
    const endpoint = completed
      ? `${supabaseUrl}/rest/v1/progress?on_conflict=user_id,subject,chapter_name`
      : `${supabaseUrl}/rest/v1/progress?user_id=eq.${encodeURIComponent(userId)}&subject=eq.${encodeURIComponent(subject)}&chapter_name=eq.${encodeURIComponent(chapter)}`;

    const res = await fetch(endpoint, {
      method: completed ? 'POST' : 'DELETE',
      headers: completed
        ? getSupabaseHeaders(true, true)
        : getSupabaseHeaders(),
      body: completed
        ? JSON.stringify({
            user_id: userId,
            subject,
            chapter_name: chapter,
            completed: true,
            completed_at: new Date().toISOString()
          })
        : null
    });
    
    if (res.ok) {
      updateSyncStatus();
      return;
    }
    supabaseReady = false;
    updateSyncStatus();
  } catch (e) {
    console.warn('Failed to sync to Supabase:', e);
    supabaseReady = false;
    updateSyncStatus();
  }
}

function showReward(chapter) {
  const notification = document.createElement('div');
  notification.className = 'reward-notification';
  notification.innerHTML = `
    <h3>🎉 Chapter Complete!</h3>
    <p>+${POINTS_PER_CHAPTER} Points</p>
    <p style="font-size: 0.85rem; margin-top: 10px;">${chapter}</p>
  `;
  
  document.body.appendChild(notification);
  
  // Confetti
  for (let i = 0; i < 20; i++) {
    const confetti = document.createElement('div');
    confetti.className = 'confetti';
    confetti.style.left = Math.random() * 100 + '%';
    confetti.style.background = ['#c8b97a', '#8fb88a', '#5a8fc9'][Math.floor(Math.random() * 3)];
    confetti.style.animationDelay = (Math.random() * 0.3) + 's';
    document.body.appendChild(confetti);
  }
  
  setTimeout(() => notification.remove(), 3000);
}

function updateSyncStatus(syncing = false) {
  const status = document.getElementById('syncStatus');
  if (syncing) {
    status.textContent = '⟳ Syncing...';
    status.className = 'sync-status syncing';
  } else if (supabaseReady) {
    status.textContent = '✓ Synced';
    status.className = 'sync-status synced';
  } else {
    status.textContent = '⊕ Local Only';
    status.className = 'sync-status';
  }
}

// ====== INIT ======
document.addEventListener('DOMContentLoaded', () => {
  localProgress = JSON.parse(localStorage.getItem('progress') || '{}');

  localStorage.setItem('userId', userId);
  localStorage.setItem('supabaseUrl', supabaseUrl);
  localStorage.setItem('supabaseKey', supabaseKey);

  initSupabase();
  
  renderUI();
});
</script>
